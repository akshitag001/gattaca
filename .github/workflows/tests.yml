name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch hand-landmark models (cv2.dnn)
        run: python scripts/fetch_models.py || echo "models unavailable; classical detector fallback"
      - name: OpenCV build info
        run: python -c "import cv2; print(cv2.__version__); print(cv2.getBuildInformation()[:800])"
      - name: Run tests
        run: python -m pytest -q
